---
- name: Configure MySQL
  block:
    - name: Install MySQL packages
      ansible.builtin.package:
        name: "{{ mysql_packages }}"
        state: present
      register: mysql_install
      tags: install

    - name: Start MySQL service
      ansible.builtin.service:
        name: "{{ mysql_service_name }}"
        state: started
        enabled: true
      register: mysql_service
      tags: service

    - name: Wait for MySQL
      ansible.builtin.wait_for:
        port: "{{ mysql_port }}"
        timeout: 30
      register: mysql_port_result
      until: mysql_port_result is succeeded
      retries: 3
      delay: 5

    - name: Create MySQL database
      community.mysql.mysql_db:
        name: "{{ mysql_database }}"
        state: present
      register: mysql_database_result

    - name: Create MySQL user
      community.mysql.mysql_user:
        name: "{{ mysql_user }}"
        password: "{{ mysql_password }}"
        priv: "{{ mysql_database }}.*:ALL"
        state: present
      no_log: true

    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ mysql_backup_directory }}"
        state: directory
        mode: "0755"

    - name: Allow MySQL through UFW
      community.general.ufw:
        rule: allow
        port: "{{ mysql_port | string }}"
        proto: tcp
        state: enabled
      when: ansible_os_family == "Debian"
      tags: firewall

  rescue:
    - name: Show failure message
      ansible.builtin.debug:
        msg: "MySQL configuration failed on {{ inventory_hostname }}."

    - name: Fail the current host
      ansible.builtin.fail:
        msg: "Unable to configure MySQL."

  always:
    - name: Display completion message
      ansible.builtin.debug:
        msg: "MySQL role finished on {{ inventory_hostname }}."
